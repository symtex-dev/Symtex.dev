name: Build Dev Environment

on: 
    push:
        branches: 
            - dev

jobs:
  Build-Terragrunt-Env:
    permissions: 
      contents: read
      id-token: write
  
    env:
      CONNECTIVITY_SUBSCRIPTION_ID: ${{ vars.CONNECTIVITY_SUBSCRIPTION_ID }}
      DNS_RESOURCE_GROUP_NAME: ${{ vars.DNS_RESOURCE_GROUP_NAME }}

    runs-on: ubuntu-latest
    outputs:
      azure-logged-in: ${{ steps.login-to-azure.outputs.logged-in }}
      storage_account_name: ${{ steps.get_storage.outputs.storage_account_name }}
      connection_string: ${{ steps.get_connection_string.outputs.connection_string}}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
    
      - name: Azure Login with OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}


      - name: Set up terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: '0.82.2'
          tofu_version: '1.10.1'

      - name: Set azure environment variables
        run: |
          echo "AZURE_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> $GITHUB_ENV
          echo "AZURE_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "AZURE_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }}" >> $GITHUB_ENV


      - name: Run Terragrunt init in Dev
        run: |
          cd backend/terragrunt/live/dev
          terragrunt init --all --non-interactive


      - name: Run Terragrunt Apply in Dev
        run: |
          cd backend/terragrunt/live/dev
          terragrunt apply --all --auto-approve --non-interactive -lock=false



          

  Push-to-Static-resorce:
    needs: Build-Terragrunt-Env
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      id-token: write
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/website/symtex-dev-site/package-lock.json

      - name: Install and build admin frontend
        working-directory: frontend/website/symtex-dev-site
        env:
          VITE_API_URL: ${{ vars.ADMIN_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/website/symtex-dev-site/build
          api_location: ""
          output_location: ""
          skip_app_build: true
